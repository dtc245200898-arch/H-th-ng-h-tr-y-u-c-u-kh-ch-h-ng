<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hỗ trợ yêu cầu khách hàng</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">Support Desk</p>
      <h1>Yêu cầu hỗ trợ</h1>
    </div>
    <div class="live-status"><span></span><b id="connectionText">Đang kết nối</b></div>
  </header>

  <main>
    <section class="panel create-panel">
      <h2>Tạo yêu cầu mới</h2>
      <form id="ticketForm">
        <label>Tiêu đề<input name="title" required placeholder="Ví dụ: Không đăng nhập được"></label>
        <label>Nội dung<textarea name="description" required rows="4" placeholder="Mô tả chi tiết vấn đề..."></textarea></label>
        <label>Người gửi<input name="requester" required placeholder="Tên hoặc email"></label>
        <label>Mức ưu tiên
          <select name="priority">
            <option>Low</option><option selected>Medium</option><option>High</option>
          </select>
        </label>
        <button type="submit">Gửi yêu cầu</button>
      </form>
    </section>

    <section class="panel queue-panel">
      <div class="section-head">
        <h2>Danh sách yêu cầu</h2>
        <select id="statusFilter" aria-label="Lọc trạng thái">
          <option value="">Tất cả trạng thái</option>
          <option>New</option><option>Assigned</option><option>InProgress</option>
          <option>Resolved</option><option>Closed</option>
        </select>
      </div>
      <div id="ticketList" class="ticket-list"></div>
    </section>
  </main>

  <dialog id="detailDialog">
    <button class="close-dialog" id="closeDialog" aria-label="Đóng">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
