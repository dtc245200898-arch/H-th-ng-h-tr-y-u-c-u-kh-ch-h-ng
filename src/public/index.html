<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hỗ trợ yêu cầu khách hàng</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon"><i data-lucide="headphones"></i></div>
      <div><strong>Support Desk</strong><span>Hỗ trợ khách hàng</span></div>
    </div>

    <nav aria-label="Điều hướng chính">
      <button class="nav-item active" data-nav="home"><i data-lucide="home"></i><span>Trang chủ</span></button>
      <button class="nav-item" data-nav="tickets"><i data-lucide="clipboard-list"></i><span>Yêu cầu của tôi</span></button>
      <button class="nav-item" data-nav="notifications"><i data-lucide="bell"></i><span>Thông báo</span><b id="notificationCount">2</b></button>
      <button class="nav-item" data-nav="settings"><i data-lucide="settings"></i><span>Cài đặt</span></button>
    </nav>

    <div class="sidebar-help">
      <div class="help-icon"><i data-lucide="headset"></i></div>
      <strong>Cần hỗ trợ?</strong>
      <span>Liên hệ chúng tôi bất cứ lúc nào!</span>
      <button id="chatButton" type="button"><i data-lucide="send"></i>Chat ngay</button>
    </div>
  </aside>

  <main class="workspace">
    <section class="welcome">
      <div>
        <h1><span class="wave">👋</span> Chào bạn!</h1>
        <p>Tạo yêu cầu hỗ trợ để được chúng tôi giúp đỡ nhanh nhất</p>
      </div>
      <div class="support-art" aria-hidden="true">
        <div class="chat-bubble"><span></span><span></span><span></span></div>
        <div class="agent"><div class="hair"></div><div class="head"><div class="eyes"></div></div><div class="body"></div><div class="laptop"></div></div>
        <div class="shield"><i data-lucide="shield-check"></i></div>
      </div>
    </section>

    <div class="content-grid">
      <section class="panel create-panel">
        <div class="panel-title blue"><i data-lucide="plus"></i><div><h2>Tạo yêu cầu mới</h2><p>Điền thông tin bên dưới để gửi yêu cầu hỗ trợ</p></div></div>
        <form id="ticketForm">
          <label><span><i data-lucide="tag"></i>Tiêu đề <b>*</b></span>
            <div class="counter-field"><input name="title" required maxlength="100" placeholder="Ví dụ: Không đăng nhập được"><small class="char-count">0/100</small></div>
          </label>
          <label><span><i data-lucide="message-square"></i>Nội dung <b>*</b></span>
            <div class="counter-field"><textarea name="description" required maxlength="500" rows="5" placeholder="Mô tả chi tiết vấn đề của bạn..."></textarea><small class="char-count">0/500</small></div>
          </label>
          <div class="form-row">
            <label><span><i data-lucide="mail"></i>Người gửi</span><input name="requester" required placeholder="Tên hoặc email"></label>
            <label><span><i data-lucide="grid-2x2"></i>Mức ưu tiên</span>
              <select name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select>
            </label>
          </div>
          <button class="submit-button" type="submit"><i data-lucide="send"></i>Gửi yêu cầu</button>
        </form>
      </section>

      <section class="panel queue-panel">
        <div class="list-header">
          <div class="list-title"><i data-lucide="clipboard-list"></i><h2>Danh sách yêu cầu</h2></div>
          <div class="filter-wrap"><i data-lucide="filter"></i><select id="statusFilter" aria-label="Lọc trạng thái"><option value="">Tất cả trạng thái</option><option>New</option><option>Assigned</option><option>InProgress</option><option>Resolved</option><option>Closed</option></select></div>
        </div>
        <div id="ticketList" class="ticket-list"></div>
      </section>
    </div>
  </main>

  <dialog id="detailDialog">
    <button class="close-dialog" id="closeDialog" aria-label="Đóng"><i data-lucide="x"></i></button>
    <div id="dialogContent"></div>
  </dialog>

  <dialog id="utilityDialog" class="utility-dialog">
    <button class="close-dialog utility-close" aria-label="Đóng"><i data-lucide="x"></i></button>
    <div id="utilityContent"></div>
  </dialog>

  <div class="live-status"><span></span><b id="connectionText">Đang kết nối</b></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
